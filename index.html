<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#d7e4f2" />
    <meta name="theme-color" content="#d7e4f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#d7e4f2" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="supported-color-schemes" content="light" />
    <title>PharmConsilium</title>
    <link rel="preload" as="image" href="pharmacy.png" />
    <link rel="preload" as="image" href="polyclinic.png" />
    <link rel="preload" as="image" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=8" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="asset-preload" aria-hidden="true">
      <img src="pharmacy.png" alt="" width="1" height="1" decoding="async" />
      <img src="polyclinic.png" alt="" width="1" height="1" decoding="async" />
      <img src="logo.png" alt="" width="1" height="1" decoding="async" />
    </div>
    <div class="atmosphere" aria-hidden="true">
      <span class="atm-wash atm-wash-a"></span>
      <span class="atm-wash atm-wash-b"></span>
      <span class="atm-wash atm-wash-c"></span>
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <span class="atm-cross atm-cross-a"></span>
      <span class="atm-cross atm-cross-b"></span>
      <span class="atm-capsule atm-capsule-a"></span>
      <span class="atm-capsule atm-capsule-b"></span>
      <span class="atm-capsule atm-capsule-c"></span>
      <span class="atm-bubble" style="--i: 0"></span>
      <span class="atm-bubble" style="--i: 1"></span>
      <span class="atm-bubble" style="--i: 2"></span>
      <span class="atm-bubble" style="--i: 3"></span>
      <span class="atm-bubble" style="--i: 4"></span>
      <span class="atm-bubble" style="--i: 5"></span>
      <span class="atm-grid"></span>
      <span class="grain"></span>
    </div>

    <main class="app">
      <section class="screen screen-welcome is-active" id="welcome" aria-label="Старт">
        <header class="brand-block">
          <div class="welcome-logo">
            <button class="welcome-logo-btn" type="button" id="welcome-logo-btn" aria-label="Крутить логотип">
              <span class="welcome-logo-stage">
                <span class="welcome-logo-mark" id="welcome-logo-mark"></span>
              </span>
            </button>
          </div>
          <h1 class="brand" aria-label="PharmConsilium">
            <span class="brand-word" aria-hidden="true">
              <span class="brand-part brand-pharm">
                <span class="brand-letter" style="--i: 0">P</span>
                <span class="brand-letter" style="--i: 1">h</span>
                <span class="brand-letter" style="--i: 2">a</span>
                <span class="brand-letter" style="--i: 3">r</span>
                <span class="brand-letter" style="--i: 4">m</span>
              </span>
              <span class="brand-part brand-consilium">
                <span class="brand-letter" style="--i: 0">C</span>
                <span class="brand-letter" style="--i: 1">o</span>
                <span class="brand-letter" style="--i: 2">n</span>
                <span class="brand-letter" style="--i: 3">s</span>
                <span class="brand-letter" style="--i: 4">i</span>
                <span class="brand-letter" style="--i: 5">l</span>
                <span class="brand-letter" style="--i: 6">i</span>
                <span class="brand-letter" style="--i: 7">u</span>
                <span class="brand-letter" style="--i: 8">m</span>
              </span>
            </span>
          </h1>
        </header>

        <form class="welcome-form" id="start-form" autocomplete="name">
          <label class="field">
            <span class="field-label">Ваше имя</span>
            <input
              class="field-input"
              id="player-name"
              name="playerName"
              type="text"
              maxlength="32"
              placeholder="Как к вам обращаться?"
              required
              enterkeyhint="go"
              autocapitalize="words"
            />
          </label>
          <button class="btn btn-primary" type="submit">Старт</button>
          <button class="btn btn-secondary welcome-results-btn" type="button" id="welcome-results-btn">
            Посмотреть результаты
          </button>
        </form>
      </section>

      <section class="screen screen-dashboard" id="dashboard" aria-label="Результаты" hidden>
        <header class="dashboard-header">
          <p class="greeting">PharmConsilium</p>
          <div class="levels-row">
            <button class="btn-back" type="button" id="dashboard-back-btn" aria-label="Назад к игре">
              <span aria-hidden="true">←</span>
            </button>
            <h1 class="levels-title">Результаты</h1>
            <button class="btn-back dashboard-refresh" type="button" id="dashboard-refresh-btn" aria-label="Обновить">
              <span aria-hidden="true">↻</span>
            </button>
          </div>
          <p class="dashboard-meta" id="dashboard-meta">Загрузка…</p>
        </header>

        <div class="dashboard-tabs" id="dashboard-tabs" role="tablist" aria-label="Уровни"></div>
        <div class="dashboard-panel" id="dashboard-panel"></div>
      </section>

      <section class="screen screen-levels" id="levels" aria-label="Уровни" hidden>
        <header class="levels-header">
          <p class="greeting" id="greeting">Здравствуйте</p>
          <div class="levels-row">
            <button class="btn-back" type="button" id="back-btn" aria-label="Назад">
              <span aria-hidden="true">←</span>
            </button>
            <h2 class="levels-title">Выбор уровня</h2>
          </div>
        </header>

        <div class="levels-map" aria-hidden="true">
          <svg class="levels-map-routes" viewBox="0 0 320 220" preserveAspectRatio="xMidYMid meet">
            <path class="levels-map-road" d="M160 110 C160 80 160 52 160 30" />
            <path class="levels-map-road" d="M160 110 C198 92 230 78 258 58" />
            <path class="levels-map-road" d="M160 110 C198 128 230 146 258 164" />
            <path class="levels-map-road" d="M160 110 C122 128 90 146 62 164" />
            <path class="levels-map-road" d="M160 110 C122 92 90 78 62 58" />
          </svg>

          <div class="levels-map-spot levels-map-pharmacy" style="--x: 50%; --y: 12%">
            <img src="pharmacy.png" alt="" decoding="async" />
          </div>
          <div class="levels-map-spot levels-map-pharmacy" style="--x: 84%; --y: 30%">
            <img src="pharmacy.png" alt="" decoding="async" />
          </div>
          <div class="levels-map-spot levels-map-pharmacy" style="--x: 84%; --y: 72%">
            <img src="pharmacy.png" alt="" decoding="async" />
          </div>
          <div class="levels-map-spot levels-map-pharmacy" style="--x: 16%; --y: 72%">
            <img src="pharmacy.png" alt="" decoding="async" />
          </div>
          <div class="levels-map-spot levels-map-pharmacy" style="--x: 16%; --y: 30%">
            <img src="pharmacy.png" alt="" decoding="async" />
          </div>

          <div class="levels-map-spot levels-map-clinic" style="--x: 50%; --y: 50%">
            <img src="polyclinic.png" alt="" decoding="async" />
          </div>
        </div>

        <div class="level-list" role="list">
          <button class="level" type="button" data-level="1" role="listitem">
            <span class="level-index">I</span>
            <span class="level-body">
              <span class="level-name">Уровень I</span>
            </span>
          </button>

          <button class="level" type="button" data-level="2" role="listitem">
            <span class="level-index">II</span>
            <span class="level-body">
              <span class="level-name">Уровень II</span>
            </span>
          </button>

          <button class="level" type="button" data-level="3" role="listitem">
            <span class="level-index">III</span>
            <span class="level-body">
              <span class="level-name">Уровень III</span>
            </span>
          </button>
        </div>
      </section>

      <section class="screen screen-play" id="play" aria-label="Игра" hidden>
        <header class="play-header">
          <button class="btn-back" type="button" id="to-levels-btn" aria-label="К уровням">
            <span aria-hidden="true">←</span>
          </button>
          <div class="play-heading">
            <h2 class="play-title" id="play-level-title"></h2>
          </div>
        </header>
        <div class="play-arena" id="play-arena">
          <svg class="play-routes" id="play-routes" aria-hidden="true"></svg>
          <div class="play-runner" id="play-runner" hidden aria-hidden="true">
            <span class="play-runner-figure">
              <span class="play-runner-head">
                <span class="play-runner-eye play-runner-eye-l"></span>
                <span class="play-runner-eye play-runner-eye-r"></span>
                <span class="play-runner-mouth"></span>
              </span>
              <span class="play-runner-arm play-runner-arm-l"></span>
              <span class="play-runner-arm play-runner-arm-r"></span>
              <span class="play-runner-torso"></span>
              <span class="play-runner-leg play-runner-leg-l"></span>
              <span class="play-runner-leg play-runner-leg-r"></span>
            </span>
          </div>
          <div class="play-sky" id="play-sky" aria-live="polite"></div>
          <div class="play-ground">
            <div class="play-timer" aria-live="polite">
              <span class="play-timer-label">Время</span>
              <span class="play-timer-value" id="play-timer-value">15</span>
            </div>
            <div class="play-polyclinic" id="play-polyclinic">
              <img
                class="play-polyclinic-img"
                src="polyclinic.png"
                alt=""
                decoding="async"
                fetchpriority="high"
              />
              <span class="play-polyclinic-label">Поликлиника</span>
            </div>
            <div class="play-points" aria-live="polite">
              <span class="play-points-label">Очки</span>
              <span class="play-points-value" id="play-points-value">0</span>
            </div>
          </div>
        </div>
      </section>

      <section class="screen screen-briefing" id="briefing" aria-label="Инструкция" hidden>
        <div class="briefing-card">
          <p class="briefing-kicker" id="briefing-level"></p>
          <h2 class="briefing-title">Правила</h2>
          <div class="briefing-body" id="briefing-text"></div>
          <p class="briefing-time">На уровень даётся <strong>15 секунд</strong></p>
          <div class="briefing-actions">
            <button class="btn btn-primary" type="button" id="briefing-start-btn">Начать</button>
            <button class="btn btn-secondary" type="button" id="briefing-back-btn">Назад</button>
          </div>
        </div>
      </section>

      <section class="screen screen-results" id="results" aria-label="Результаты" hidden>
        <div class="results-card">
          <p class="results-kicker" id="results-level"></p>
          <h2 class="results-title">Результаты</h2>
          <p class="results-score-label">Набрано очков</p>
          <p class="results-score" id="results-score">0</p>
          <div class="results-actions">
            <button class="btn btn-primary" type="button" id="results-next-btn" hidden>
              Перейти к следующему уровню
            </button>
            <button class="btn btn-primary" type="button" id="results-again-btn">Играть снова</button>
            <button class="btn btn-secondary" type="button" id="results-levels-btn">
              К выбору уровней
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="config.js?v=7"></script>
    <script src="app.js?v=7"></script>
  </body>
</html>
